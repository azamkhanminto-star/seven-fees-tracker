<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>3M Detailing — Workshop Management</title>
<meta name="description" content="Job cards, bookings, customers, feedback, inventory and accounts for a car wash and detailing workshop.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/styles.css">
<link rel="icon" href="assets/icon.svg">
<link rel="apple-touch-icon" href="assets/icon.svg">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">3M</span>
    <div class="brand-text">
      <strong id="shopName">3M Detailing</strong>
      <span class="muted" id="shopSub">Workshop management</span>
    </div>
  </div>

  <div class="topbar-search">
    <input type="search" id="globalSearch" placeholder="Search job card, customer, phone or vehicle…" autocomplete="off" aria-label="Search">
    <div class="search-results" id="searchResults" hidden></div>
  </div>

  <div class="topbar-actions">
    <button class="btn primary" id="btnNewJob" type="button">+ Job card</button>
    <button class="btn ghost icon" id="themeToggle" type="button" title="Switch light / dark" aria-label="Switch theme">◑</button>
  </div>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
  <button class="tab is-active" role="tab" data-view="dashboard">Dashboard</button>
  <button class="tab" role="tab" data-view="jobs">Job Cards</button>
  <button class="tab" role="tab" data-view="bookings">Bookings</button>
  <button class="tab" role="tab" data-view="customers">Customers</button>
  <button class="tab" role="tab" data-view="feedback">Feedback</button>
  <button class="tab" role="tab" data-view="followups">Follow-ups</button>
  <button class="tab" role="tab" data-view="inventory">Inventory</button>
  <button class="tab" role="tab" data-view="accounts">Accounts</button>
  <button class="tab" role="tab" data-view="reports">Reports</button>
  <button class="tab" role="tab" data-view="setup">Setup</button>
</nav>

<main id="app" tabindex="-1"><!-- views render here --></main>

<footer class="app-foot">
  <span class="muted sm">3M Detailing · data stays on this device — take a backup from <a href="#setup" data-nav="setup">Setup → Data</a>.</span>
</footer>

<div class="modal-wrap" id="modal" aria-live="polite"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/util.js"></script>
<script src="assets/store.js"></script>
<script src="assets/app.js"></script>
<script src="assets/view-dashboard.js"></script>
<script src="assets/view-jobs.js"></script>
<script src="assets/view-bookings.js"></script>
<script src="assets/view-customers.js"></script>
<script src="assets/view-feedback.js"></script>
<script src="assets/view-followups.js"></script>
<script src="assets/view-inventory.js"></script>
<script src="assets/view-accounts.js"></script>
<script src="assets/view-reports.js"></script>
<script src="assets/view-setup.js"></script>
</body>
</html>
